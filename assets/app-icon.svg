<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- VEROA Official App Icon / PWA Icon (Ocean & Mineral Palette) -->
  <rect width="512" height="512" rx="112" fill="#F8FAF9"/>
  <rect width="512" height="512" rx="112" fill="url(#surface_grad)"/>
  
  <defs>
    <linearGradient id="surface_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAF9"/>
