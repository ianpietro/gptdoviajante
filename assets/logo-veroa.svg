    <path d="M20 12L30 34L40 12" stroke="#A9CBC8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Wordmark VEROA -->
  <g fill="#344A59" font-family="'Sora', sans-serif" font-weight="800" font-size="34" letter-spacing="4">
