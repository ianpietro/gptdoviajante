<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Página não encontrada - CoPiloto de Viagem</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/vendas.css">
  
  <style>
    .not-found-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .not-found-title {
      font-size: 6rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0;
      line-height: 1;
    }
    .not-found-subtitle {
      font-size: 2rem;
      margin-bottom: 20px;
    }
    .not-found-text {
      font-size: 1.1rem;
      color: var(--text-light);
      margin-bottom: 40px;
      max-width: 500px;
    }
  </style>
</head>
<body>
  <div class="not-found-container container">
    <h1 class="not-found-title">404</h1>
    <h2 class="not-found-subtitle">Ops! Parece que você se perdeu na rota.</h2>
    <p class="not-found-text">
      Não conseguimos encontrar o destino que você estava procurando. A página pode ter sido movida ou não existe mais.
    </p>
    <a href="/" class="btn btn-primary">
      <i class="fa-solid fa-plane"></i> Voltar para a Home
    </a>
  </div>
</body>
</html>
