  <div class="modal-overlay hidden" id="reservationModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 100000; padding: 20px; box-sizing: border-box;">
    <div class="modal-card glass-panel" style="max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; border-radius: var(--border-radius-lg); box-shadow: var(--shadow-lg);">
      <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
        <h3 id="reservationModalTitle" style="margin: 0; font-size: 1.2rem; font-weight: 700; color: var(--text-main);"><i class="fa-solid fa-bookmark" style="color: var(--primary); margin-right: 8px;"></i> Adicionar Reserva</h3>
        <button class="modal-close" id="closeReservationModal" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <form class="modal-form" id="reservationForm" style="display: flex; flex-direction: column; gap: 14px;">
        <input type="hidden" id="editReservationId" value="">
        
        <div class="input-group" style="display: flex; flex-direction: column; gap: 6px;">
          <label for="resTypeInput" style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.05em;">Tipo de Reserva *</label>
          <select id="resTypeInput" required style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 10px 12px; color: white; outline: none; font-size: 0.9rem;">
            <option value="Passagem Aérea">Passagem Aérea</option>
            <option value="Hospedagem">Hospedagem</option>
            <option value="Ingresso">Ingresso</option>
            <option value="Seguro Viagem">Seguro Viagem</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div class="input-group" style="display: flex; flex-direction: column; gap: 6px;">
          <label for="resTitleInput" style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.05em;">Título / Nome *</label>
          <input type="text" id="resTitleInput" placeholder="Ex: Voo para Paris, Hotel Copacabana" required style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 10px 12px; color: white; outline: none; font-size: 0.9rem;">
        </div>

        <div style="display: flex; gap: 12px;">
          <div class="input-group" style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
            <label for="resProviderInput" style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.05em;">Empresa / Provedor</label>
            <input type="text" id="resProviderInput" placeholder="Ex: LATAM, Booking" style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 10px 12px; color: white; outline: none; font-size: 0.9rem;">
          </div>
          <div class="input-group" style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
            <label for="resReferenceInput" style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.05em;">Código de Reserva</label>
            <input type="text" id="resReferenceInput" placeholder="Ex: ABC123" style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 10px 12px; color: white; outline: none; font-size: 0.9rem;">
          </div>
        </div>

        <div style="display: flex; gap: 12px;">
          <div class="input-group" style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
            <label for="resStartDateInput" style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.05em;">Data de Início *</label>
            <input type="datetime-local" id="resStartDateInput" required style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 10px 12px; color: white; outline: none; font-size: 0.9rem;">
          </div>
          <div class="input-group" style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
            <label for="resEndDateInput" style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.05em;">Data de Fim</label>
            <input type="datetime-local" id="resEndDateInput" style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 10px 12px; color: white; outline: none; font-size: 0.9rem;">
          </div>
        </div>

        <div class="input-group" style="display: flex; flex-direction: column; gap: 6px;">
          <label for="resNotesInput" style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.05em;">Anotações</label>
          <textarea id="resNotesInput" placeholder="Ex: Portão 4, Check-in às 14h..." style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 10px 12px; color: white; outline: none; font-size: 0.9rem; min-height: 80px; resize: vertical;"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="padding: 12px; font-size: 0.9rem; font-weight: 700; margin-top: 10px;">
          <i class="fa-solid fa-floppy-disk"></i> Salvar Reserva
        </button>
      </form>
    </div>
  </div>
